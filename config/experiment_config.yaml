experiment:
  inference_interval: 2.0
  model_name: "yolov8s-worldv2.pt"
  crop_size: 640
  max_radius_px: 200.0
  classes:
    - book
    - smartphone
    - pen
    - notebook
    - paper
    - cup
    - bottle
    - keyboard
    - mouse
    - glasses
    - keys
    - wallet
    - remote control
    - charger
    - cable
    - headphones
    - bag
    - scissors
    - ruler
    - watch
    - laptop
    - tablet
    - monitor
    - chair
    - hand
    - face

gesture_experiment:
  inference_interval: 1.0
  weights_path: "./weights/hagrid/YOLOv10n_gestures.pt"
  weights_url: "https://rndml-team-cv.obs.ru-moscow-1.hc.sbercloud.ru/datasets/hagrid_v2/models/YOLOv10n_gestures.pt"
  confidence_threshold: 0.35
  min_speech_confidence: 0.80
  speech_cooldown_s: 4.0
  image_size: 640
  device: "cpu"
  auto_download: true
